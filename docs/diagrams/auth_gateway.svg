<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="260" fill="#ffffff" rx="8"/>

  <!-- Orchestrator -->
  <rect x="20" y="90" width="150" height="70" rx="8" fill="#f6f8fa" stroke="#30363d" stroke-width="1.5"/>
  <text x="95" y="120" text-anchor="middle" font-size="14" font-weight="600" fill="#24292f">Orchestrator</text>
  <text x="95" y="138" text-anchor="middle" font-size="12" fill="#57606a">(MCP client)</text>

  <!-- Gateway -->
  <rect x="250" y="70" width="170" height="110" rx="8" fill="#eef2ff" stroke="#30363d" stroke-width="1.5"/>
  <text x="335" y="96" text-anchor="middle" font-size="14" font-weight="600" fill="#24292f">MCP Gateway</text>
  <text x="335" y="113" text-anchor="middle" font-size="11" fill="#57606a">Gateway API + Connectivity Link</text>
  <text x="335" y="133" text-anchor="middle" font-size="11" fill="#57606a">AuthPolicy (Authorino)</text>
  <text x="335" y="149" text-anchor="middle" font-size="11" fill="#57606a">RateLimitPolicy (Limitador)</text>

  <!-- Vendor MCP servers -->
  <rect x="560" y="20" width="180" height="55" rx="8" fill="#f6f8fa" stroke="#30363d" stroke-width="1.5"/>
  <text x="650" y="45" text-anchor="middle" font-size="13" font-weight="600" fill="#24292f">Vendor A MCP Server</text>
  <text x="650" y="62" text-anchor="middle" font-size="11" fill="#57606a">(Platform KB)</text>

  <rect x="560" y="100" width="180" height="55" rx="8" fill="#f6f8fa" stroke="#30363d" stroke-width="1.5"/>
  <text x="650" y="125" text-anchor="middle" font-size="13" font-weight="600" fill="#24292f">Vendor B MCP Server</text>
  <text x="650" y="142" text-anchor="middle" font-size="11" fill="#57606a">(RAN KB)</text>

  <rect x="560" y="180" width="180" height="55" rx="8" fill="#f6f8fa" stroke="#30363d" stroke-width="1.5"/>
  <text x="650" y="205" text-anchor="middle" font-size="13" font-weight="600" fill="#24292f">Vendor C MCP Server</text>
  <text x="650" y="222" text-anchor="middle" font-size="11" fill="#57606a">(Network KB)</text>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#24292f"/>
    </marker>
  </defs>

  <line x1="170" y1="125" x2="248" y2="125" stroke="#24292f" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="209" y="115" text-anchor="middle" font-size="11" fill="#57606a">MCP</text>

  <line x1="420" y1="105" x2="558" y2="48" stroke="#24292f" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="420" y1="125" x2="558" y2="128" stroke="#24292f" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="420" y1="145" x2="558" y2="207" stroke="#24292f" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="490" y="200" text-anchor="middle" font-size="11" fill="#57606a">MCP (authenticated, rate-limited)</text>
</svg>
