<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Helvetica, Arial, sans-serif">
  <rect width="720" height="300" fill="#ffffff" rx="8"/>

  <!-- Orchestrator box -->
  <rect x="20" y="110" width="200" height="80" rx="8" fill="#f6f8fa" stroke="#30363d" stroke-width="1.5"/>
  <text x="120" y="145" text-anchor="middle" font-size="15" font-weight="600" fill="#24292f">Orchestrator</text>
  <text x="120" y="165" text-anchor="middle" font-size="13" fill="#57606a">(NOS / Copilot)</text>

  <!-- Vendor A -->
  <rect x="500" y="30" width="200" height="60" rx="8" fill="#f6f8fa" stroke="#30363d" stroke-width="1.5"/>
  <text x="600" y="56" text-anchor="middle" font-size="15" font-weight="600" fill="#24292f">Vendor A Agent</text>
  <text x="600" y="74" text-anchor="middle" font-size="12" fill="#57606a">(Platform KB)</text>

  <!-- Vendor B -->
  <rect x="500" y="120" width="200" height="60" rx="8" fill="#f6f8fa" stroke="#30363d" stroke-width="1.5"/>
  <text x="600" y="146" text-anchor="middle" font-size="15" font-weight="600" fill="#24292f">Vendor B Agent</text>
  <text x="600" y="164" text-anchor="middle" font-size="12" fill="#57606a">(RAN KB)</text>

  <!-- Vendor C -->
  <rect x="500" y="210" width="200" height="60" rx="8" fill="#f6f8fa" stroke="#30363d" stroke-width="1.5"/>
  <text x="600" y="236" text-anchor="middle" font-size="15" font-weight="600" fill="#24292f">Vendor C Agent</text>
  <text x="600" y="254" text-anchor="middle" font-size="12" fill="#57606a">(Network KB)</text>

  <defs>
    <marker id="arrow-start" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M7,1 L1,4 L7,7 Z" fill="#24292f"/>
    </marker>
    <marker id="arrow-end" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#24292f"/>
    </marker>
  </defs>

  <!-- Connector to Vendor A -->
  <line x1="220" y1="140" x2="500" y2="60" stroke="#24292f" stroke-width="1.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text x="360" y="90" text-anchor="middle" font-size="12" fill="#57606a">MCP</text>

  <!-- Connector to Vendor B -->
  <line x1="220" y1="150" x2="500" y2="150" stroke="#24292f" stroke-width="1.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text x="360" y="142" text-anchor="middle" font-size="12" fill="#57606a">MCP</text>

  <!-- Connector to Vendor C -->
  <line x1="220" y1="160" x2="500" y2="240" stroke="#24292f" stroke-width="1.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text x="360" y="212" text-anchor="middle" font-size="12" fill="#57606a">MCP</text>
</svg>
