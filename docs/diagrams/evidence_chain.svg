    <text x="110" y="326" text-anchor="middle">Trigger platform-side</text>
    <text x="110" y="339" text-anchor="middle">analysis</text>
    <line x1="180" y1="328" x2="208" y2="328" stroke="#24292f" stroke-width="1.3" marker-end="url(#ar)"/>

    <rect x="210" y="310" width="140" height="36" rx="5" fill="#ffffff" stroke="#57606a"/>
    <text x="280" y="326" text-anchor="middle">Packet forensics to</text>
    <text x="280" y="339" text-anchor="middle">capture the disturbance</text>
    <line x1="350" y1="328" x2="378" y2="328" stroke="#24292f" stroke-width="1.3" marker-end="url(#ar)"/>

    <rect x="380" y="310" width="140" height="36" rx="5" fill="#ffffff" stroke="#57606a"/>
    <text x="450" y="326" text-anchor="middle">Hardware timestamp-</text>
    <text x="450" y="339" text-anchor="middle">path analysis</text>
    <line x1="520" y1="328" x2="548" y2="328" stroke="#24292f" stroke-width="1.3" marker-end="url(#ar)"/>

    <rect x="550" y="310" width="170" height="36" rx="5" fill="#24292f"/>
    <text x="635" y="326" text-anchor="middle" fill="#ffffff">Root cause: egress</text>
    <text x="635" y="339" text-anchor="middle" fill="#ffffff">hardware timestamp miss</text>
