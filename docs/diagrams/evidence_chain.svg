    <text x="295" y="42" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Platform Agent</text>
    <text x="220" y="74" font-size="11" fill="#24292f">PTP daemon logs:</text>
    <text x="220" y="90" font-size="11" fill="#9a6700">master offset spike,</text>
    <text x="220" y="106" font-size="11" fill="#57606a">normalizing post-event</text>
    <text x="220" y="130" font-size="11" fill="#24292f">Timing CloudEvents:</text>
