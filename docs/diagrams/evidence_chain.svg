    <text x="600" y="90" font-size="11" fill="#9a6700">egress HW timestamp</text>
    <text x="600" y="106" font-size="11" fill="#9a6700">timeout for seq=X</text>
    <text x="600" y="130" font-size="11" fill="#24292f">driver debug:</text>
    <text x="600" y="146" font-size="11" fill="#9a6700">stale timestamp popped</text>
    <text x="600" y="162" font-size="11" fill="#57606a">into next window</text>
    <text x="600" y="186" font-size="11" fill="#24292f">counters:</text>
    <text x="600" y="202" font-size="11" fill="#9a6700">tx_hwtstamp_timeouts</text>
