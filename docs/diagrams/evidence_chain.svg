    <text x="220" y="162" font-size="11" fill="#9a6700">large offset values</text>
  </g>

  <g>
    <rect x="400" y="20" width="170" height="250" rx="8" fill="#f6f8fa" stroke="#30363d" stroke-width="1.5"/>
    <rect x="400" y="20" width="170" height="34" rx="8" fill="#24292f"/>
    <text x="485" y="42" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Forensics Agent</text>
    <text x="410" y="74" font-size="11" fill="#24292f">gNB RX:</text>
    <text x="410" y="90" font-size="11" fill="#9a6700">Follow_Up of Sync X</text>
    <text x="410" y="106" font-size="11" fill="#9a6700">missing; X+1 carries</text>
    <text x="410" y="122" font-size="11" fill="#9a6700">prior-origin timestamp</text>
    <text x="410" y="146" font-size="11" fill="#24292f">GM TX:</text>
    <text x="410" y="162" font-size="11" fill="#9a6700">Follow_Up X never sent;</text>
    <text x="410" y="178" font-size="11" fill="#57606a">preciseOriginTimestamp</text>
    <text x="410" y="194" font-size="11" fill="#57606a">matches previous Sync</text>
  </g>

  <g>
    <rect x="590" y="20" width="150" height="250" rx="8" fill="#f6f8fa" stroke="#30363d" stroke-width="1.5"/>
    <rect x="590" y="20" width="150" height="34" rx="8" fill="#24292f"/>
    <text x="665" y="42" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Hardware Agent</text>
