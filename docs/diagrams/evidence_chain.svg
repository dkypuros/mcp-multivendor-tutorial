  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#24292f"/>
    </marker>
  </defs>

  <g font-size="10.5" fill="#24292f">
