<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="420" fill="#ffffff" rx="8"/>

  <!-- evidence plane columns -->
  <g>
    <rect x="20" y="20" width="170" height="250" rx="8" fill="#f6f8fa" stroke="#30363d" stroke-width="1.5"/>
    <rect x="20" y="20" width="170" height="34" rx="8" fill="#24292f"/>
    <text x="105" y="42" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">RAN Agent</text>
    <text x="30" y="74" font-size="11" fill="#24292f">DU alerts:</text>
    <text x="30" y="90" font-size="11" fill="#9a6700">cell unavailable</text>
    <text x="30" y="114" font-size="11" fill="#24292f">Clock-state history:</text>
    <text x="30" y="130" font-size="11" fill="#9a6700">FREERUN &#8596; LOCKED</text>
    <text x="30" y="146" font-size="11" fill="#57606a">oscillation around</text>
    <text x="30" y="162" font-size="11" fill="#57606a">the incident</text>
  </g>

  <g>
    <rect x="210" y="20" width="170" height="250" rx="8" fill="#f6f8fa" stroke="#30363d" stroke-width="1.5"/>
